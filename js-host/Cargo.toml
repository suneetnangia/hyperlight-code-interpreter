[package]
name = "js-host"
version = "0.1.0"
edition = "2024"

[dependencies]
hyperlight-js = { git = "https://github.com/hyperlight-dev/hyperlight-js", rev = "764646b804bb6e2659afa9d392b92361fc238946" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
actix-web = "4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking"] }
toml = "0.8"
