[package]
edition = "2024"
rust-version = "1.88.0"
name = "oxc_resolver"
version = "11.19.1"
authors = ["Boshen <boshenc@gmail.com>"]
build = false
include = [
    "/src",
    "/examples",
    "/benches",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "ESM / CJS module resolution"
homepage = "https://github.com/oxc-project/oxc-resolver"
readme = "README.md"
keywords = [
    "node",
    "resolve",
    "cjs",
    "esm",
    "enhanced-resolve",
]
categories = ["development-tools"]
license = "MIT"
repository = "https://github.com/oxc-project/oxc-resolver"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
codspeed = ["criterion2/codspeed"]
default = []
yarn_pnp = ["pnp"]

[lib]
name = "oxc_resolver"
path = "src/lib.rs"
doctest = false

[[example]]
name = "dir"
path = "examples/dir.rs"

[[example]]
name = "file"
path = "examples/file.rs"

[[example]]
name = "many"
path = "examples/many.rs"

[[bench]]
name = "resolver"
path = "benches/resolver.rs"
harness = false

[dependencies.cfg-if]
version = "1"

[dependencies.compact_str]
version = "0.9"

[dependencies.document-features]
version = "0.2.12"
optional = true

[dependencies.fast-glob]
version = "1"

[dependencies.indexmap]
version = "2"
features = ["serde"]

[dependencies.json-strip-comments]
version = "3.1"

[dependencies.nodejs-built-in-modules]
version = "1.0.0"

[dependencies.once_cell]
version = "1"

[dependencies.papaya]
version = "0.2"

[dependencies.pnp]
version = "0.12.8"
optional = true

[dependencies.rustc-hash]
version = "2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]

[dependencies.simdutf8]
version = "0.1"

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"

[dev-dependencies.criterion2]
version = "3.0.2"
default-features = false

[dev-dependencies.dirs]
version = "6.0.0"

[dev-dependencies.fancy-regex]
version = "^0.17.0"
features = ["std"]
default-features = false

[dev-dependencies.pico-args]
version = "0.5.0"

[dev-dependencies.rayon]
version = "1.11.0"

[dev-dependencies.vfs]
version = "0.12.2"

[dev-dependencies.walkdir]
version = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies.rustix]
version = "1.1.3"
features = ["fs"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.url]
version = "2"

[target.'cfg(target_endian = "little")'.dependencies.self_cell]
version = "1"

[target.'cfg(target_endian = "little")'.dependencies.simd-json]
version = "0.17.0"
features = ["runtime-detection"]
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = ["Win32_Storage_FileSystem"]

[target.'cfg(target_os = "windows")'.dev-dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Storage",
    "Win32_Storage_FileSystem",
]

[lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
doc_markdown = "allow"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
impl_trait_in_params = "warn"
literal_string_with_formatting_args = "allow"
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
todo = "warn"
too_many_arguments = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
panic = "abort"
strip = "symbols"

[profile.release.package.regex-automata]
opt-level = "z"

[profile.release.package.regex-syntax]
opt-level = "z"

[profile.test]
debug = 0

[profile.wasm-test]
opt-level = "z"
debug = 2
inherits = "test"
